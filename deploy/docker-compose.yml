services:
  smart-agent:
    build:
      # Build from the repo root so the Dockerfile in deploy/ can COPY src/, public/, server/, etc.
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: smart-agent
    ports:
      - "5181:5181"
    env_file:
      - .env
    environment:
      # n8n authenticates writes with this key (spec §2.2).
      QUALITY_API_KEY: ${QUALITY_API_KEY:?QUALITY_API_KEY must be set in deploy/.env}
      PORT: "5181"
      QUALITY_DB_PATH: /app/data/quality.db
      # Per-team edit codes for the Config-mode Team editor. Lives in the data
      # volume (below), NOT under dist/config — that dir is web-served. This is
      # the default the server already computes; set explicitly for clarity.
      TEAM_CODES_PATH: /app/data/team-codes.json
      # LLM proxy (GWM internal). env_file injects deploy/.env into the container;
      # these provide explicit defaults at interpolation time. EXPLORE_DISABLE_MCP and
      # INTERNAL_API_TOKEN, when set in deploy/.env, are injected via env_file above.
      LLMPROXY_API_KEY: ${LLMPROXY_API_KEY:-}
      LLMPROXY_BASE_URL: ${LLMPROXY_BASE_URL:-https://llmproxy.gwm.cn/v1}
    volumes:
      # Editable runtime configs (projects, team-members, components, summary-options).
      # SEED this host dir with the four deploy/config/*.json files before first run:
      # the Config-mode Team editor reads AND writes them here, so an empty volume
      # makes saves fail and dropdowns fall back to baked-in defaults.
      - /usr/local/smart_agent/data:/app/dist/config
      # SQLite DB for the View-mode quality grid + team-codes.json (per-team edit
      # codes; NOT web-served). Survives container restarts. Drop team-codes.json
      # (see deploy/team-codes.sample.json) into this host dir to enable editing.
      - /usr/local/smart_agent/quality-db:/app/data
    restart: unless-stopped
